project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - publications.qmd
    - projects.qmd
    - code.qmd

website:
  title: "Paweł Motyka"
  description: "Consciousness science, psychophysiology and virtual reality – Institute of Psychology, Polish Academy of Sciences."
  # After the domain is connected, change this to https://pawelmotyka.com
  site-url: https://pawel-motyka.github.io
  favicon: assets/favicon.svg
  open-graph: true
  navbar:
    title: "Paweł Motyka"
    left:
      - href: publications.qmd
        text: Publications
      - href: projects.qmd
        text: Projects
      - href: code.qmd
        text: Code & data
    right:
      - icon: github
        href: https://github.com/Pawel-Motyka
        aria-label: GitHub
      - icon: envelope
        href: mailto:pmotyka@psych.pan.pl
        aria-label: E-mail
  page-footer:
    left: "© 2026 Paweł Motyka"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [default, styles/light.scss]
      dark: [default, styles/dark.scss]
    respect-user-color-scheme: true
    css: styles/site.css
    toc: false
    page-layout: article
    smooth-scroll: true
    link-external-newwindow: true
    lang: en
